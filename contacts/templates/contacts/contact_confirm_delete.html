{% extends 'base.html' %}

{% block title %}Usuń kontakt | Kontakty{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">
            <a href="{% url 'contacts:contact_list' %}" class="d-inline-block text-secondary text-decoration-none mb-3">&larr; Lista kontaktów</a>
            <div class="card shadow-sm">
                <div class="card-body p-3 p-sm-4">
                    <h1 class="h3 fw-semibold mb-3">Usuń kontakt</h1>
                    <p class="mb-2">Czy na pewno chcesz usunąć kontakt <strong>{{ contact }}</strong>?</p>
                    <p class="text-body-secondary mb-4">Tej operacji nie można cofnąć.</p>

                    <form method="post" action="{% url 'contacts:contact_delete' contact.pk %}" class="d-flex gap-2 border-top pt-3">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Usuń kontakt</button>
                        <a href="{% url 'contacts:contact_list' %}" class="btn btn-outline-secondary">Anuluj</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
